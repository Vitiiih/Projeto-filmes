<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Streamix</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #0f0f0f;
  color: #fff;
  padding-bottom: 120px; 
}

/* HOME */
.catalogo {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 25px;
  padding: 20px;
}

.card {
  cursor: pointer;
  text-align: center;
  transition: transform 0.3s;
  background:#222;
  border-radius:12px;
  overflow:hidden;
}

.card:hover {
  transform: scale(1.07);
}

#home .card img {
  width: 100%;
  height: 270px;
  object-fit: cover;
  border-radius: 12px;
}

.episodios-cards-temporada .card img {
  width: 100%;
  height: auto;      /* Mantém a proporção correta */
  aspect-ratio: 16 / 9;  /* Garante proporção 16:9 */
  object-fit: cover;
  border-radius: 12px;
}

.episodios-cards-temporada {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
  margin-top: 20px;
}



.card h4 {
  margin: 10px 0;
  font-size: 14px;
}

.serie {
  display: none;
  padding: 20px;
}

.btn-voltar {
  cursor: pointer;
  color: #aaa;
  margin-bottom: 20px;
}

.btn-voltar:hover {
  color: #fff;
}

.serie-header {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.serie-header img {
  width: 220px;
  height: 330px;
  object-fit: cover;
  border-radius: 12px;
}

.format-selector {
  display: flex;
  gap: 30px; /* mais espaço entre os botões */
  margin-top: 40px; /* mais pra baixo */
}

.format-selector button {
  background:#e50914; /* vermelho Netflix-like */
  border:none;
  color:white;
  padding:10px 75px; /* largura maior */
  font-size:16px;
  border-radius:6px;
  cursor:pointer;
   transition: transform 0.2s, background 0.3s; /* animações */
}

.format-selector button:hover {
  background: #ff4d4d; /* vermelho mais claro ao passar o mouse */
   transform: scale(1.05);
}

/* Ao clicar, efeito de "aperto" */
.format-selector button:active {
  transform: scale(0.95);
}

/* TEMPORADAS */
.temporada {
  cursor: pointer;
  background: #333;
  padding: 10px 15px;
  margin-top: 10px;
  border-radius: 8px;
  transition: background 0.3s;
}

.temporada:hover {
  background: #555;
}

.episodios-cards-temporada {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s ease, padding 0.5s ease;
  margin-top: 10px;
  padding: 0 0;
}

.episodios-cards-temporada.show {
  max-height: 2000px;
  padding: 10px 0;
}
#dublado-container {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height 0.5s ease, opacity 0.5s ease;
}

#dublado-container.show {
  max-height: 2000px; /* suficientemente grande para a temporada */
  opacity: 1;
}


/* EASTER EGG */
#egg {
  display:none;
  position: fixed;
  bottom: 120px;
  right: 20px;
  background: rgba(0,0,0,0.85);
  padding:16px 22px;
  border-radius:12px;
  font-family:'Pacifico', cursive;
  font-size:28px;
  color:#ff4fd8;
  z-index:10000;
}

/* ANÚNCIO RODAPÉ */
#ad-footer {
  position: fixed;
  bottom:0;
  left:0;
  width:100%;
  height:90px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

#ad-footer button {
  background:#e50914;
  border:none;
  color:white;
  padding:14px 24px;
  font-size:16px;
  border-radius:6px;
  cursor:pointer;
}


</style>

function carregarEpisodios() {
  const container = document.getElementById('temporada1');
  jujutsuEpisodes.forEach(ep => {
    const cardD = document.createElement('div');
    cardD.className = 'card episodio dublado';
    cardD.innerHTML = `<img src="${ep.img}" alt="${ep.title}"><h4>${ep.title} (Dublado)</h4>`;
    cardD.onclick = () => abrirEpisodio(ep.dublado);
    container.appendChild(cardD);

    const cardL = document.createElement('div');
    cardL.className = 'card episodio legendado';
    cardL.innerHTML = `<img src="${ep.img}" alt="${ep.title}"><h4>${ep.title} (Legendado)</h4>`;
    cardL.onclick = () => abrirEpisodio(ep.legendado);
    container.appendChild(cardL);
  });
}

function toggleTemporada(id) {
  const el = document.getElementById(id);

  // Se ainda não carregou episódios, carrega agora
  if (!el.dataset.carregado) {
    carregarEpisodios();
    el.dataset.carregado = "true";
  }

  el.classList.toggle('show');
}


function carregarEpisodios() {
  const container = document.getElementById('temporada1');
  if (!container) return;

  container.innerHTML = '';

  jujutsuEpisodes.forEach(ep => {
    const cardD = document.createElement('div');
    cardD.className = 'card episodio dublado';
    cardD.innerHTML = `
      <img src="${ep.img}" alt="${ep.title}">
      <h4>${ep.title}</h4>
    `;
    cardD.onclick = () => abrirEpisodio(ep.dublado);
    container.appendChild(cardD);
  });
}

function mostrarFormato(formato) {
  const container = document.getElementById('dublado-container');

  if (formato !== 'dublado') {
    // mostrar legendado sem animação na Dublado
    container.style.display = 'block';
    return;
  }

  // toggle da animação
  if (container.classList.contains('show')) {
    container.classList.remove('show');
    // opcional: remover o conteúdo após animação
    setTimeout(() => { container.style.display = 'none'; container.innerHTML = ''; }, 500);
    return;
  }

  // se não estava visível
  container.style.display = 'block';
 container.innerHTML = `
  <h3 class="temporada" onclick="toggleTemporada('temporada1')">
    Temporada 1
  </h3>
  <div class="episodios-cards-temporada" id="temporada1"></div>
`;


  // dá um pequeno delay para ativar a animação
  setTimeout(() => {
    container.classList.add('show');
  }, 10);
}

function abrirSerie(id) {
  document.getElementById("home").style.display = "none";
  document.querySelectorAll(".serie").forEach(s => s.style.display = "none");
  document.getElementById(id).style.display = "block";
}

function voltar() {
  document.querySelectorAll(".serie").forEach(s => s.style.display = "none");
  document.getElementById("home").style.display = "grid";
}

function abrirEpisodio(url) {
  window.open(url, "_blank");
}

function abrirAnuncio() {
  window.open("https://www.effectivegatecpm.com/xs8v78xt?key=9df63df96261b5b715efb2efa7016459", "_blank");
}

document.getElementById("logo").addEventListener("click", function () {
  var egg = document.getElementById("egg");
  egg.style.display = "block";
  setTimeout(() => { egg.style.display = "none"; }, 5000);
});

carregarEpisodios();
